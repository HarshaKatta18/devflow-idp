<!DOCTYPE html>
<html>
<head>
  <title>DevFlow Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚀 DevFlow Platform</h1>
<p>Deploy your application in one click</p>

<div class="form-container">

  <label>Choose Template:</label>
  <select id="template">
    <option value="nodejs">Node.js API</option>
    <option value="static">Static Website</option>
    <option value="worker">Background Worker</option>
  </select>

  <label>GitHub Repository URL:</label>
  <input id="repo" type="text" placeholder="https://github.com/user/repo">

  <label>Application Name:</label>
  <input id="appname" type="text" placeholder="my-app">

  <button onclick="deploy()">🚀 Deploy</button>

</div>

<script src="script.js"></script>

</body>
</html>
