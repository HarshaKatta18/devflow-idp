<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevFlow Platform</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1f4037, #99f2c8);
      text-align: center;
      margin: 0;
      padding: 0;
      color: white;
    }

    .container {
      margin-top: 100px;
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 12px;
      width: 50%;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .sub-text {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    input, select {
      padding: 12px;
      margin: 10px;
      width: 70%;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    button {
      padding: 12px 25px;
      background: #00c6ff;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0072ff;
    }

    #status {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>DevFlow Platform</h1>
    <p>Deploy your application in one click</p>
    <p class="sub-text">
      Integrated with Prometheus & Grafana for real-time monitoring
    </p>

    <label>Select Template</label><br>
    <select id="template">
      <option>Node.js API</option>
      <option>Static Website</option>
      <option>Background Worker</option>
    </select><br>

    <input type="text" id="repo" placeholder="GitHub Repository URL"><br>
    <input type="text" id="appName" placeholder="Application Name"><br>

    <button id="deployBtn">Deploy</button>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>

</body>
</html>
