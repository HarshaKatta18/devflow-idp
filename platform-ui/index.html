<!DOCTYPE html>
<html>
<head>
  <title>DevFlow Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚀 DevFlow Platform</h1>
<p>Select a template to deploy</p>

<div class="catalog">

  <div class="card">
    <h2>Node.js API</h2>
    <button onclick="deploy('nodejs')">Deploy</button>
  </div>

  <div class="card">
    <h2>Static Website</h2>
    <button onclick="deploy('static')">Deploy</button>
  </div>

  <div class="card">
    <h2>Background Worker</h2>
    <button onclick="deploy('worker')">Deploy</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
