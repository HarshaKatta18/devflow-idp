name: DevFlow Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      template:
        description: "Template"
        required: true
        default: "nodejs"

      repo_url:
        description: "GitHub repo URL"
        required: true

      app_name:
        description: "App name"
        required: true

env:
  TEMPLATE: ${{ github.event.inputs.template }}
  REPO_URL: ${{ github.event.inputs.repo_url }}
  APP_NAME: ${{ github.event.inputs.app_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 400 key.pem

      # =========================
      # 🚀 NODE.JS DEPLOYMENT (USER REPO)
      # =========================
      - name: Deploy Node App
        if: env.TEMPLATE == 'nodejs'
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          
          cd ~

          rm -rf $APP_NAME
          git clone $REPO_URL $APP_NAME

          cd $APP_NAME

          source ~/.bashrc
          nvm use 16

          npm install
          pkill node || true

          nohup node index.js > app.log 2>&1 &

          sudo rm -f /etc/nginx/conf.d/app.conf

          echo "server {
              listen 80 default_server;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
              }
          }" | sudo tee /etc/nginx/conf.d/app.conf

          sudo systemctl restart nginx

          EOF

      # =========================
      # 🌐 STATIC DEPLOYMENT
      # =========================
      - name: Deploy Static Website
        if: env.TEMPLATE == 'static'
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          
          sudo rm -rf /usr/share/nginx/html/*
          mkdir -p ~/static-site
          
          EOF

          scp -o StrictHostKeyChecking=no -i key.pem -r templates/static-site/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/static-site/

          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          
          sudo cp -r ~/static-site/* /usr/share/nginx/html/

          sudo rm -f /etc/nginx/conf.d/app.conf

          echo "server {
              listen 80 default_server;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
          }" | sudo tee /etc/nginx/conf.d/default.conf

          sudo systemctl restart nginx
          
          EOF

      # =========================
      # ⚙️ WORKER DEPLOYMENT
      # =========================
      - name: Deploy Background Worker
        if: env.TEMPLATE == 'worker'
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem -r templates/worker ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~

          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          
          pkill -f worker.js || true
          cd ~/worker

          nohup node worker.js > worker.log 2>&1 &
          
          EOF