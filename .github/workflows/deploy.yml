name: DevFlow Deployment

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template (nodejs / static / worker)"
        required: true
      repo_url:
        description: "GitHub repo URL"
        required: true
      app_name:
        description: "App name"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for workflow context only)
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          REPO_URL="${{ github.event.inputs.repo_url }}"
          APP_NAME="${{ github.event.inputs.app_name }}"
          TEMPLATE="${{ github.event.inputs.template }}"

          echo "🚀 Starting deployment..."
          echo "Template: $TEMPLATE"
          echo "Repo: $REPO_URL"
          echo "App: $APP_NAME"

          cd ~

          echo "🧹 Cleaning old app..."
          rm -rf $APP_NAME

          echo "📥 Cloning fresh repo..."
          git clone $REPO_URL $APP_NAME

          if [ ! -d "$APP_NAME" ]; then
            echo "❌ Clone failed!"
            exit 1
          fi

          echo "📂 Repo contents:"
          ls $APP_NAME

          ########################################
          # 🌐 STATIC WEBSITE
          ########################################
          if [ "$TEMPLATE" = "static" ]; then

            echo "🌐 Deploying Static Website..."

            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r $APP_NAME/* /usr/share/nginx/html/
            sudo chmod -R 755 /usr/share/nginx/html

            echo "⚙️ Configuring Nginx for STATIC..."
            echo "server {
                listen 80;
                server_name _;
                root /usr/share/nginx/html;
                index index.html;

                location / {
                    try_files \$uri \$uri/ =404;
                }
            }" | sudo tee /etc/nginx/conf.d/app.conf

            sudo systemctl restart nginx

          ########################################
          # 🚀 NODE.JS API
          ########################################
          elif [ "$TEMPLATE" = "nodejs" ]; then

            echo "🚀 Deploying Node.js App..."

            cd $APP_NAME

            source ~/.bashrc
            nvm use 16

            npm install

            echo "🛑 Killing old Node processes..."
            pkill node || true

            echo "▶️ Starting Node app..."
            if [ -f package.json ]; then
              nohup npm start > app.log 2>&1 &
            else
              nohup node index.js > app.log 2>&1 &
            fi

            echo "⚙️ Configuring Nginx for NODE..."
            echo "server {
                listen 80;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:3000;
                }
            }" | sudo tee /etc/nginx/conf.d/app.conf

            sudo systemctl restart nginx

          ########################################
          # ⚙️ BACKGROUND WORKER
          ########################################
          elif [ "$TEMPLATE" = "worker" ]; then

            echo "⚙️ Deploying Worker..."

            cd $APP_NAME

            pkill -f worker.js || true
            nohup node worker.js > worker.log 2>&1 &

          else
            echo "❌ Unknown template"
            exit 1
          fi

          echo "✅ Deployment Completed!"

          EOF