name: DevFlow Deployment

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template (nodejs / static / worker)"
        required: true
      repo_url:
        description: "GitHub repo URL"
        required: true
      app_name:
        description: "App name"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Inputs
        run: |
          echo "Template: ${{ github.event.inputs.template }}"
          echo "Repo: ${{ github.event.inputs.repo_url }}"
          echo "App Name: ${{ github.event.inputs.app_name }}"

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 400 key.pem

      # 🚀 NODE.JS DEPLOYMENT
      - name: Deploy Node App
        if: ${{ github.event.inputs.template == 'nodejs' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          set -e

          REPO_URL="${{ github.event.inputs.repo_url }}"
          APP_NAME="${{ github.event.inputs.app_name }}"

          echo "Deploying Node App: \$APP_NAME"

          cd ~
          rm -rf \$APP_NAME

          git clone \$REPO_URL \$APP_NAME
          cd \$APP_NAME

          # Load Node
          source ~/.bashrc
          nvm use 16

          npm install

          # Kill only this app
          pkill -f "node index.js" || true

          nohup npm start > app.log 2>&1 &

          # Configure Nginx
          sudo rm -f /etc/nginx/conf.d/app.conf

          echo "server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:3000;
              }
          }" | sudo tee /etc/nginx/conf.d/app.conf

          sudo systemctl restart nginx

          echo "Node app deployed successfully!"
          EOF

      # 🌐 STATIC WEBSITE DEPLOYMENT
      - name: Deploy Static Website
        if: ${{ github.event.inputs.template == 'static' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          REPO_URL="${{ github.event.inputs.repo_url }}"
          APP_NAME="${{ github.event.inputs.app_name }}"

          cd ~
          rm -rf \$APP_NAME

          git clone \$REPO_URL \$APP_NAME

          # Copy static files
          sudo rm -rf /usr/share/nginx/html/*
          sudo cp -r \$APP_NAME/* /usr/share/nginx/html/

          # 🔥 STOP NODE APP (important)
          pkill node || true

          # 🔥 RESET NGINX TO STATIC
          echo "server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files \$uri \$uri/ =404;
              }
          }" | sudo tee /etc/nginx/conf.d/app.conf

          sudo systemctl restart nginx
          EOF

      # ⚙️ BACKGROUND WORKER DEPLOYMENT
      - name: Deploy Worker
        if: ${{ github.event.inputs.template == 'worker' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          set -e

          REPO_URL="${{ github.event.inputs.repo_url }}"
          APP_NAME="${{ github.event.inputs.app_name }}"

          echo "Deploying Worker: \$APP_NAME"

          cd ~
          rm -rf \$APP_NAME

          git clone \$REPO_URL \$APP_NAME
          cd \$APP_NAME

          pkill -f "worker.js" || true

          nohup node worker.js > worker.log 2>&1 &

          echo "Worker started successfully!"
          EOF